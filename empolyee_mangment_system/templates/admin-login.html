<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin login</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='admin-login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='footer.css') }}">

</head>
<body>
    {% include "navbar.html" %}

    <main>
        <section>
            <div class="container">
                <div class="main-container">
                    <form  action="/admin-login" method="post" class="form1">
                        <h2>Welcome Admin Login</h2>
                        <div>
                            <input name="email" class="input" type="text" placeholder="Enter email" required>
                        </div>
                            <input name="password" class="input" type="password" placeholder="Enter passwod" required>
                        <div>
                            <button class="btn">submit</button>
                        </div>

                    </form>
                </div>
                <div class="main-container1">
                    <img class="img" src="{{ url_for('static', filename='images/profile.jpg') }}" alt="profile">
                    <div class="profile-container">
                        <h3 class="h3">Empolyee Management</h3>
                    </div>
                </div>
            </div>
        </section>
    </main>

    {% include "footer.html" %}

</body> 
</html>
